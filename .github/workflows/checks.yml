name: Checks

# Runs on every pull request so problems show up before anything reaches choppercheck.com.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Type check
        run: npm run check
      - name: Hook-order check (catches the blank-page crash pattern)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install headless browser
        run: npx playwright install --with-deps chromium
      - name: Smoke check (load site, open a rig and its weather)
        run: npm run smoke
